<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>祝夏子凤生日快乐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif;}
body{
  min-height:100vh;
  background:#050520;
  color:#fff;
  overflow-x:hidden;
  position:relative;
}
/* 音乐图标按钮右上角 */
.music-btn{
  position:fixed;
  top:16px;
  right:16px;
  width:44px;height:44px;
  border-radius:50%;
  background:rgba(255,255,255,0.15);
  border:2px solid #ffd700;
  color:#ffd700;
  font-size:22px;
  display:flex;align-items:center;justify-content:center;
  z-index:9999;
  cursor:pointer;
  user-select:none;
}
/* 烟花画布全屏 */
#fireworkCanvas{
  position:fixed;
  top:0;left:0;
  width:100vw;height:100vh;
  pointer-events:none;
  z-index:1;
}
.main-wrap{
  position:relative;
  z-index:2;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
  text-align:center;
}
h1{
  font-size:clamp(2rem,6vw,4rem);
  color:#ffdd77;
  text-shadow:0 0 12px #ffaa22,0 0 24px #ff6622;
  margin-bottom:40px;
}
.btns-group{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
  justify-content:center;
  margin-bottom:80px;
}
.btn{
  padding:14px 32px;
  font-size:18px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#ff7088,#ffbc42);
  color:#111;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}
.btn:hover{transform:scale(1.08);box-shadow:0 0 20px rgba(255,180,80,0.6);}

/* 弹窗通用遮罩 */
.mask{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
}
.pop-card{
  width:min(90vw,520px);
  background:#1a1a38;
  border-radius:16px;
  padding:24px;
  border:2px solid #ffcc66;
}
.pop-card h2{color:#ffdd88;margin-bottom:16px;}
.pop-card textarea{
  width:100%;
  min-height:140px;
  background:#0f0f28;
  color:#fff;
  border:1px solid #ffbb55;
  border-radius:8px;
  padding:12px;
  font-size:16px;
  resize:vertical;
}
.pop-bottom{
  display:flex;gap:12px;margin-top:16px;justify-content:flex-end;
}
/* 电影滚动字幕弹窗 */
.scroll-mask{
  position:fixed;
  inset:0;
  background:#000;
  z-index:120;
  display:none;
  overflow:hidden;
}
.scroll-input-wrap{
  position:absolute;
  top:20px;left:20px;right:20px;
  z-index:5;
}
.scroll-input-wrap textarea{
  width:100%;
  max-width:600px;
  height:120px;
  background:#111;color:#fff;border:1px solid #ffcc00;padding:10px;
  border-radius:6px;
}
.scroll-text-container{
  width:100%;
  height:100vh;
  position:relative;
}
.scroll-text{
  position:absolute;
  width:90%;
  max-width:600px;
  left:50%;
  transform:translateX(-50%);
  bottom:-100vh;
  font-size:clamp(18px,3vw,26px);
  color:#ffdd77;
  line-height:2;
  text-align:center;
  white-space:pre-wrap;
}
.close-scroll{
  position:absolute;
  top:16px;right:16px;
  z-index:10;
  padding:8px 16px;
  background:#ff4455;color:#fff;border:none;border-radius:6px;cursor:pointer;
}

/* 时间轴区域 */
.timeline-wrap{
  width:100%;
  max-width:1100px;
  margin-top:60px;
  overflow:hidden;
  position:relative;
  height:140px;
  border-top:1px solid rgba(255,220,120,0.3);
  border-bottom:1px solid rgba(255,220,120,0.3);
}
.timeline-inner{
  display:flex;
  height:100%;
  align-items:center;
  gap:40px;
  white-space:nowrap;
  animation:timelineLoop 25s linear infinite;
}
@keyframes timelineLoop{
  0%{transform:translateX(0);}
  100%{transform:translateX(-50%);}
}
.timeline-item{
  display:inline-flex;
  flex-direction:column;
  align-items:center;
  min-width:70px;
}
.t-year{font-size:20px;color:#ffdd77;font-weight:bold;}
.t-age{font-size:15px;color:#ffaaaa;margin-top:4px;}

/* 音频 */
audio{display:none;}
</style>
</head>
<body>
<audio id="bgMusic" loop>
  <source src="bg.mp3" type="audio/mpeg">

<audio id="talkMusic" loop>
  <source src="talk.mp3" type="audio/mpeg">


<div class="music-btn" id="musicToggle">🔊</div>
<canvas id="fireworkCanvas"></canvas>

<div class="main-wrap">
  <h1>🎉 祝夏子凤生日快乐 🎉</h1>
  <div class="btns-group">
    <button class="btn" id="openCardBtn">庆生卡片</button>
    <button class="btn" id="openTalkBtn">我想对你说</button>
  </div>

  <!-- 时间轴容器 -->
  <div class="timeline-wrap">
    <div class="timeline-inner" id="timelineBox"></div>
  </div>
</div>

<!-- 庆生卡片弹窗 -->
<div class="mask" id="cardMask">
  <div class="pop-card">
    <h2>✍️写下你的祝福</h2>
    <textarea id="cardText" placeholder="在这里输入你想对夏子凤说的话..."></textarea>
    <div class="pop-bottom">
      <button class="btn" id="closeCardBtn">关闭贺卡</button>
    </div>
  </div>
</div>

<!-- 电影滚动字幕弹窗 -->
<div class="scroll-mask" id="scrollMask">
  <div class="scroll-input-wrap">
    <textarea id="scrollInput" placeholder="自定义电影片尾滚动文字，多行输入即可"></textarea>
  </div>
  <button class="close-scroll" id="closeScrollBtn">关闭</button>
  <div class="scroll-text-container">
    <div class="scroll-text" id="scrollDom"></div>
  </div>
</div>

<script>
// ========== 1.生成时间轴 2008零岁~2026 ==========
const timelineBox = document.getElementById('timelineBox');
const startYear = 2008;
const endYear = 2026;
let htmlStr = '';
for(let y = startYear;y<=endYear;y++){
  const age = y - startYear;
  htmlStr += `<div class="timeline-item"><div class="t-year">${y}年</div><div class="t-age">${age}岁</div></div>`;
}
// 复制一份实现无缝循环
timelineBox.innerHTML = htmlStr + htmlStr;

// ========== 2.音频控制 ==========
const bgMusic = document.getElementById('bgMusic');
const talkMusic = document.getElementById('talkMusic');
const musicToggle = document.getElementById('musicToggle');
let musicPlayState = true;

// 页面自动播放，浏览器策略需要一次交互兜底
document.addEventListener('click',()=>{
  bgMusic.play().catch(e=>{});
},{once:true});

musicToggle.onclick = ()=>{
  if(musicPlayState){
    bgMusic.pause();talkMusic.pause();
    musicToggle.innerText = '🔇';
    musicPlayState = false;
  }else{
    if(!document.getElementById('scrollMask').style.display || document.getElementById('scrollMask').style.display==='none'){
      bgMusic.play();
    }else{
      talkMusic.play();
    }
    musicToggle.innerText = '🔊';
    musicPlayState = true;
  }
}

// ==========3.庆生卡片弹窗 ==========
const cardMask = document.getElementById('cardMask');
const openCardBtn = document.getElementById('openCardBtn');
const closeCardBtn = document.getElementById('closeCardBtn');
openCardBtn.onclick = ()=>{
  cardMask.style.display = 'flex';
}
closeCardBtn.onclick = ()=>{
  cardMask.style.display = 'none';
  // 关闭贺卡触发文字烟花：夏子凤生日快乐
  launchTextFirework("夏子凤生日快乐");
}

// ==========4.我想对你说：电影滚动字幕 ==========
const scrollMask = document.getElementById('scrollMask');
const openTalkBtn = document.getElementById('openTalkBtn');
const closeScrollBtn = document.getElementById('closeScrollBtn');
const scrollInput = document.getElementById('scrollInput');
const scrollDom = document.getElementById('scrollDom');
openTalkBtn.onclick = ()=>{
  scrollMask.style.display = 'block';
  bgMusic.pause();
  talkMusic.currentTime = 0;
  talkMusic.play().catch(e=>{});
  // 启动滚动
  startScroll();
}
closeScrollBtn.onclick = ()=>{
  scrollMask.style.display = 'none';
  talkMusic.pause();
  bgMusic.play().catch(e=>{});
}
function startScroll(){
  scrollDom.innerText = scrollInput.value || "致夏子凤\n愿岁岁平安，万事胜意\n每一年都闪闪发光\n生日快乐！";
  scrollDom.style.bottom = "-100vh";
  scrollDom.style.transition = "none";
  setTimeout(()=>{
    scrollDom.style.transition = "bottom 22s linear";
    scrollDom.style.bottom = "120vh";
  },50);
}

// ==========5.烟花特效canvas 纯代码无图片 ==========
const canvas = document.getElementById('fireworkCanvas');
const ctx = canvas.getContext('2d');
let w,h;
function resize(){
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize',resize);

class Particle{
  constructor(x,y,color,vx,vy,size,life){
    this.x=x;this.y=y;this.color=color;
    this.vx=vx;this.vy=vy;
    this.size=size;
    this.life=life;this.maxLife=life;
  }
  update(){
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.06;
    this.life--;
  }
  draw(){
    const alpha = this.life/this.maxLife;
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
    ctx.fillStyle = this.color.replace("1)",alpha+")");
    ctx.fill();
  }
}
let particles = [];
const colors = [
  "rgba(255,210,80,1)","rgba(255,80,120,1)","rgba(80,200,255,1)",
  "rgba(120,255,160,1)","rgba(240,120,255,1)","rgba(255,140,60,1)"
];

//普通烟花
function createFirework(){
  const x = Math.random()*w;
  const y = h;
  const targetY = h*0.15 + Math.random()*h*0.35;
  const color = colors[Math.floor(Math.random()*colors.length)];
  let rocket = {x,y,vy:-7-Math.random()*3,targetY,color};
  function fly(){
    rocket.y += rocket.vy;
    if(rocket.y <= rocket.targetY){
      //爆炸
      for(let i=0;i<80;i++){
        const angle = Math.PI*2*i/80;
        const sp = 1+Math.random()*3;
        particles.push(new Particle(rocket.x,rocket.y,rocket.color,Math.cos(angle)*sp,Math.sin(angle)*sp,2+Math.random()*2,100+Math.random()*60));
      }
      return;
    }
    requestAnimationFrame(fly);
  }
  fly();
}

//文字烟花：把文字点阵变成烟花粒子
function launchTextFirework(text){
  const tempCanvas = document.createElement('canvas');
  const tctx = tempCanvas.getContext('2d');
  tempCanvas.width = w*0.8;
  tempCanvas.height = 220;
  tctx.fillStyle="#fff";
  tctx.font = "bold 80px sans-serif";
  tctx.textAlign="center";
  tctx.fillText(text,tempCanvas.width/2,130);
  const imgData = tctx.getImageData(0,0,tempCanvas.width,tempCanvas.height);
  const offsetX = w/2 - tempCanvas.width/2;
  const offsetY = h*0.35;
  //遍历像素
  for(let px=0;px<imgData.width;px+=6){
    for(let py=0;py<imgData.height;py+=6){
      const idx = (py*imgData.width+px)*4;
      const r = imgData.data[idx];
      if(r>128){
        const cx = offsetX+px;
        const cy = offsetY+py;
        const c = colors[Math.floor(Math.random()*colors.length)];
        particles.push(new Particle(cx,cy,c,(Math.random()-0.5)*1.2,(Math.random()-0.5)*1.2,2.5,140));
      }
    }
  }
}

//渲染循环
function loop(){
  ctx.fillStyle = "rgba(5,5,32,0.18)";
  ctx.fillRect(0,0,w,h);
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.update();
    p.draw();
    if(p.life <=0){
      particles.splice(i,1);
    }
  }
  requestAnimationFrame(loop);
}
loop();
//定时自动烟花
setInterval(()=>{
  createFirework();
},1400);

</script>
</body>
</html>
